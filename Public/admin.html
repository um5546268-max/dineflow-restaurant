<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Panel - The Heaven Slice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .admin-header {
            background: #1a1a2e;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e74c3c;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-header h1 {
            font-size: 1.5em;
            color: #e74c3c;
        }
        .admin-header h1 span {
            color: #e0e0e0;
            font-weight: 300;
        }
        .admin-header .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .admin-header .header-actions a, .admin-header .header-actions button {
            padding: 8px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        .admin-header .header-actions .btn-view-site {
            background: #27ae60;
            color: white;
        }
        .admin-header .header-actions .btn-view-site:hover {
            background: #1e8449;
            transform: scale(1.05);
        }
        .admin-header .header-actions .btn-staff {
            background: #3498db;
            color: white;
        }
        .admin-header .header-actions .btn-staff:hover {
            background: #2980b9;
            transform: scale(1.05);
        }
        .admin-header .header-actions .btn-logout {
            background: #e74c3c;
            color: white;
        }
        .admin-header .header-actions .btn-logout:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        .admin-header .user-info {
            color: #b2bec3;
            font-size: 0.85em;
        }
        .admin-header .user-info strong {
            color: #e0e0e0;
        }

        .admin-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }

        .admin-sidebar {
            width: 220px;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px 0;
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        .admin-sidebar .sidebar-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b2bec3;
            font-weight: 500;
        }
        .admin-sidebar .sidebar-item:hover {
            background: #2d2d44;
            color: #e0e0e0;
        }
        .admin-sidebar .sidebar-item.active {
            border-left-color: #e74c3c;
            background: #2d2d44;
            color: #e74c3c;
        }
        .admin-sidebar .sidebar-item .icon {
            font-size: 1.2em;
        }

        .admin-content {
            flex: 1;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 25px;
            min-height: 500px;
        }
        .admin-content .section-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2d2d44;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stats-grid .stat-card {
            background: #2d2d44;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }
        .stats-grid .stat-card .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #e74c3c;
        }
        .stats-grid .stat-card .stat-label {
            color: #b2bec3;
            font-size: 0.85em;
            margin-top: 4px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        .admin-table th {
            background: #2d2d44;
            padding: 10px 12px;
            text-align: left;
            color: #b2bec3;
            font-weight: 600;
            border-bottom: 2px solid #3d3d55;
        }
        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #2d2d44;
        }
        .admin-table tr:hover td {
            background: #25253a;
        }
        .admin-table .status-badge {
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
        }
        .status-pending { background: #e74c3c; color: white; }
        .status-confirmed { background: #3498db; color: white; }
        .status-preparing { background: #f39c12; color: white; }
        .status-ready { background: #27ae60; color: white; }
        .status-delivered { background: #27ae60; color: white; }
        .status-cancelled { background: #95a5a6; color: white; }

        .btn-action {
            padding: 4px 12px;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.75em;
        }
        .btn-action:hover { transform: scale(1.05); }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #b2bec3;
            font-weight: 600;
            font-size: 0.9em;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #2d2d44;
            border: 1px solid #3d3d55;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.9em;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e74c3c;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .btn-submit {
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }
        .btn-submit:hover { background: #c0392b; transform: scale(1.02); }

        .icon-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 5px 0;
        }
        .icon-selector .icon-option {
            font-size: 1.8em;
            padding: 5px 10px;
            border: 2px solid #3d3d55;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: #2d2d44;
        }
        .icon-selector .icon-option:hover {
            border-color: #e74c3c;
            transform: scale(1.1);
        }
        .icon-selector .icon-option.selected {
            border-color: #e74c3c;
            background: #3d2d2d;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .popup-overlay.show { display: flex; }
        .popup-content {
            background: #1a1a2e;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
            border: 1px solid #2d2d44;
        }
        .popup-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 1.5em;
            cursor: pointer;
            color: #b2bec3;
            background: none;
            border: none;
            transition: all 0.3s;
        }
        .popup-close:hover { color: #e74c3c; transform: rotate(90deg); }
        .popup-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3436;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 90%;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #b2bec3;
        }
        .empty-state .empty-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .admin-container { flex-direction: column; padding: 10px; }
            .admin-sidebar { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 5px; padding: 10px; }
            .admin-sidebar .sidebar-item { flex: 1; min-width: 80px; justify-content: center; padding: 8px 12px; font-size: 0.8em; border-left: none; border-bottom: 2px solid transparent; }
            .admin-sidebar .sidebar-item.active { border-bottom-color: #e74c3c; border-left: none; }
            .admin-header { flex-wrap: wrap; gap: 10px; padding: 12px 15px; }
            .admin-header h1 { font-size: 1.1em; }
            .admin-header .header-actions a, .admin-header .header-actions button { font-size: 0.7em; padding: 5px 12px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .admin-content { padding: 15px; }
            .admin-table { font-size: 0.7em; }
            .admin-table th, .admin-table td { padding: 6px 8px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .admin-sidebar .sidebar-item { font-size: 0.7em; min-width: 60px; padding: 6px 8px; }
            .admin-header h1 { font-size: 0.9em; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #3d3d55; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1>👑 <span>Admin Panel</span></h1>
        <div class="header-actions">
            <span class="user-info" id="adminUserInfo">👤 <strong>Loading...</strong></span>
            <a href="/staff?restaurant=restaurant-1" class="btn-staff">👨‍🍳 Staff</a>
            <a href="/?restaurant=restaurant-1" class="btn-view-site">📱 View Site</a>
            <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
    </header>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-item active" data-section="dashboard" onclick="showSection('dashboard')">
                <span class="icon">📊</span> Dashboard
            </div>
            <div class="sidebar-item" data-section="orders" onclick="showSection('orders')">
                <span class="icon">📦</span> Orders
                <span id="pendingOrderBadge" style="background:#e74c3c; color:white; border-radius:50%; padding:1px 8px; font-size:0.7em; margin-left:auto;">0</span>
            </div>
            <div class="sidebar-item" data-section="menu" onclick="showSection('menu')">
                <span class="icon">🍽️</span> Menu
            </div>
            <div class="sidebar-item" data-section="deals" onclick="showSection('deals')">
                <span class="icon">🔥</span> Deals
            </div>
            <div class="sidebar-item" data-section="feedback" onclick="showSection('feedback')">
                <span class="icon">⭐</span> Feedback
            </div>
            <div class="sidebar-item" data-section="locations" onclick="showSection('locations')">
                <span class="icon">📍</span> Locations
            </div>
            <div class="sidebar-item" data-section="support" onclick="showSection('support')">
                <span class="icon">🎫</span> Support
            </div>
            <div class="sidebar-item" data-section="settings" onclick="showSection('settings')">
                <span class="icon">⚙️</span> Settings
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content" id="adminContent">
            <!-- Content will be rendered here -->
        </main>
    </div>

    <!-- Add Item Popup -->
    <div class="popup-overlay" id="addItemPopup">
        <div class="popup-content">
            <button class="popup-close" onclick="closeAddItemPopup()">✕</button>
            <div class="popup-title">➕ Add Menu Item</div>
            <form id="addItemForm" onsubmit="submitMenuItem(event)">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" required placeholder="e.g., Cheese Burger" />
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="itemPrice" required placeholder="e.g., 1299" step="0.01" />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="itemCategory" required>
                        <option value="burgers">🍔 Burgers</option>
                        <option value="pizza">🍕 Pizza</option>
                        <option value="sandwiches">🥪 Sandwiches</option>
                        <option value="sides">🍟 Sides</option>
                        <option value="drinks">🥤 Drinks</option>
                        <option value="salads">🥗 Salads</option>
                        <option value="appetizers">🍤 Appetizers</option>
                        <option value="desserts">🍰 Desserts</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Icons (Click to select, max 5)</label>
                    <div class="icon-selector" id="iconSelector">
                        <span class="icon-option" data-icon="🍔">🍔</span>
                        <span class="icon-option" data-icon="🍕">🍕</span>
                        <span class="icon-option" data-icon="🥪">🥪</span>
                        <span class="icon-option" data-icon="🍟">🍟</span>
                        <span class="icon-option" data-icon="🥤">🥤</span>
                        <span class="icon-option" data-icon="🥗">🥗</span>
                        <span class="icon-option" data-icon="🍤">🍤</span>
                        <span class="icon-option" data-icon="🍰">🍰</span>
                        <span class="icon-option" data-icon="🍗">🍗</span>
                        <span class="icon-option" data-icon="🧀">🧀</span>
                        <span class="icon-option" data-icon="🥩">🥩</span>
                        <span class="icon-option" data-icon="🐔">🐔</span>
                        <span class="icon-option" data-icon="🍫">🍫</span>
                        <span class="icon-option" data-icon="☕">☕</span>
                        <span class="icon-option" data-icon="🌶️">🌶️</span>
                        <span class="icon-option" data-icon="🧅">🧅</span>
                    </div>
                    <input type="hidden" id="itemIcons" value="" />
                </div>
                <div class="form-group">
                    <label>Layers (comma separated, e.g., Cheese, Lettuce, Tomato)</label>
                    <input type="text" id="itemLayers" placeholder="e.g., 🧀 Cheese, 🥬 Lettuce, 🍅 Tomato" />
                </div>
                <button type="submit" class="btn-submit">✅ Add Item</button>
            </form>
        </div>
    </div>

    <!-- Add Deal Popup -->
    <div class="popup-overlay" id="addDealPopup">
        <div class="popup-content">
            <button class="popup-close" onclick="closeAddDealPopup()">✕</button>
            <div class="popup-title">🔥 Add Deal</div>
            <form id="addDealForm" onsubmit="submitDeal(event)">
                <div class="form-group">
                    <label>Deal Name</label>
                    <input type="text" id="dealName" required placeholder="e.g., Burger Combo" />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="dealDesc" placeholder="e.g., Cheese Burger + Fries + Drink" />
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="dealPrice" required placeholder="e.g., 1599" step="0.01" />
                </div>
                <div class="form-group">
                    <label>Original Price (for discount display)</label>
                    <input type="number" id="dealOriginal" placeholder="e.g., 2397" step="0.01" />
                </div>
                <div class="form-group">
                    <label>Icons (Click to select, max 5)</label>
                    <div class="icon-selector" id="dealIconSelector">
                        <span class="icon-option" data-icon="🍔">🍔</span>
                        <span class="icon-option" data-icon="🍕">🍕</span>
                        <span class="icon-option" data-icon="🥪">🥪</span>
                        <span class="icon-option" data-icon="🍟">🍟</span>
                        <span class="icon-option" data-icon="🥤">🥤</span>
                        <span class="icon-option" data-icon="🔥">🔥</span>
                        <span class="icon-option" data-icon="🎉">🎉</span>
                        <span class="icon-option" data-icon="💯">💯</span>
                    </div>
                    <input type="hidden" id="dealIcons" value="" />
                </div>
                <button type="submit" class="btn-submit">✅ Add Deal</button>
            </form>
        </div>
    </div>

    <!-- Receipt Settings Popup -->
    <div class="popup-overlay" id="receiptSettingsPopup">
        <div class="popup-content">
            <button class="popup-close" onclick="closeReceiptSettings()">✕</button>
            <div class="popup-title">🧾 Receipt Settings</div>
            <form id="receiptSettingsForm" onsubmit="saveReceiptSettings(event)">
                <div class="form-group">
                    <label>Logo Icon</label>
                    <input type="text" id="receiptLogoIcon" placeholder="e.g., 👨‍🍳" />
                </div>
                <div class="form-group">
                    <label>Logo URL (optional)</label>
                    <input type="url" id="receiptLogoUrl" placeholder="https://example.com/logo.png" />
                </div>
                <div class="form-group">
                    <label>Tagline</label>
                    <input type="text" id="receiptTagline" placeholder="e.g., PIZZA • BURGER • FAST FOOD" />
                </div>
                <div class="form-group">
                    <label>Thank You Message</label>
                    <input type="text" id="receiptThankYou" placeholder="Thank You for Your Order!" />
                </div>
                <div class="form-group">
                    <label>Footer Message</label>
                    <input type="text" id="receiptFooter" placeholder="Have a Great Day!" />
                </div>
                <button type="submit" class="btn-submit">💾 Save Settings</button>
            </form>
        </div>
    </div>

    <!-- Update Order Status Popup -->
    <div class="popup-overlay" id="updateOrderPopup">
        <div class="popup-content">
            <button class="popup-close" onclick="closeUpdateOrderPopup()">✕</button>
            <div class="popup-title">📦 Update Order Status</div>
            <form id="updateOrderForm" onsubmit="updateOrderStatus(event)">
                <div class="form-group">
                    <label>Order #<span id="updateOrderId"></span></label>
                    <select id="orderStatusSelect" required>
                        <option value="pending">⏳ Pending</option>
                        <option value="confirmed">✅ Confirmed</option>
                        <option value="preparing">👨‍🍳 Preparing</option>
                        <option value="ready">🟢 Ready</option>
                        <option value="delivered">📦 Delivered</option>
                        <option value="cancelled">❌ Cancelled</option>
                    </select>
                </div>
                <input type="hidden" id="updateOrderIdInput" />
                <button type="submit" class="btn-submit">✅ Update Status</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // GET RESTAURANT ID FROM URL
        // ============================================================
        function getRestaurantId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('restaurant') || 'restaurant-1';
        }
        const RESTAURANT_ID = getRestaurantId();

        // ============================================================
        // STATE
        // ============================================================
        let currentSection = 'dashboard';
        let menuItems = [];
        let deals = [];
        let orders = [];
        let feedbacks = [];
        let locations = [];
        let supportTickets = [];
        let selectedIcons = [];
        let selectedDealIcons = [];
        let restaurantName = 'The Heaven Slice';
        let currencySymbol = 'Rs';
        let isAdmin = false;

        // ============================================================
        // DOM REFS
        // ============================================================
        const content = document.getElementById('adminContent');

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadData();
        });

        // ============================================================
        // AUTH CHECK
        // ============================================================
        function checkAuth() {
            fetch('/api/user/profile')
                .then(r => r.json())
                .then(data => {
                    if (data.user) {
                        document.getElementById('adminUserInfo').innerHTML = `👤 <strong>${data.user.displayName || 'Admin'}</strong>`;
                        if (data.user.role === 'admin') {
                            isAdmin = true;
                        } else {
                            showToast('⚠️ You need admin access');
                            window.location.href = '/?restaurant=' + RESTAURANT_ID;
                        }
                    } else {
                        window.location.href = '/auth/google?restaurant=' + RESTAURANT_ID;
                    }
                })
                .catch(() => {
                    window.location.href = '/auth/google?restaurant=' + RESTAURANT_ID;
                });
        }

        function logoutAdmin() {
            localStorage.removeItem('dineflow_user');
            localStorage.removeItem('dineflow_session');
            window.location.href = '/logout?restaurant=' + RESTAURANT_ID;
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        function loadData() {
            loadRestaurantName();
            loadMenu();
            loadDeals();
            loadOrders();
            loadFeedback();
            loadLocations();
            loadSupport();
            loadConfig();
        }

        function loadRestaurantName() {
            fetch('/api/restaurant-name?t=' + Date.now() + '&restaurant=' + RESTAURANT_ID)
                .then(r => r.json())
                .then(data => {
                    restaurantName = data.name || 'The Heaven Slice';
                })
                .catch(() => {});
        }

        function loadConfig() {
            fetch('/api/restaurant-config')
                .then(r => r.json())
                .then(data => {
                    if (data && data.currency) {
                        currencySymbol = data.currency;
                    }
                })
                .catch(() => {});
        }

        function loadMenu() {
            fetch('/api/menu?t=' + Date.now() + '&restaurant=' + RESTAURANT_ID)
                .then(r => r.json())
                .then(data => {
                    menuItems = data;
                    if (currentSection === 'menu') renderMenu();
                })
                .catch(() => {});
        }

        function loadDeals() {
            fetch('/api/deals?t=' + Date.now() + '&restaurant=' + RESTAURANT_ID)
                .then(r => r.json())
                .then(data => {
                    deals = data;
                    if (currentSection === 'deals') renderDeals();
                })
                .catch(() => {});
        }

        function loadOrders() {
            fetch('/api/orders/all?restaurant=' + RESTAURANT_ID)
                .then(r => r.json())
                .then(data => {
                    orders = data;
                    updatePendingBadge();

        function openAddItemPopup() {
            selectedIcons = [];
            document.querySelectorAll('#iconSelector .icon-option').forEach(el => el.classList.remove('selected'));
            document.getElementById('itemIcons').value = '';
            document.getElementById('addItemForm').reset();
            document.getElementById('addItemPopup').classList.add('show');

        function closeAddItemPopup() {
            document.getElementById('addItemPopup').classList.remove('show');

        // Icon selection for menu items
        document.addEventListener('click', function(e) {
            if (e.target.closest('#iconSelector .icon-option')) {
                const el = e.target.closest('.icon-option');
                const icon = el.dataset.icon;
                const isSelected = el.classList.contains('selected');
                
                if (isSelected) {
                    el.classList.remove('selected');
                    selectedIcons = selectedIcons.filter(i => i !== icon);
                } else if (selectedIcons.length < 5) {
                    el.classList.add('selected');
                    selectedIcons.push(icon);
                } else {
                    showToast('⚠️ Maximum 5 icons allowed');
                }
                document.getElementById('itemIcons').value = selectedIcons.join(',');
            }

            if (e.target.closest('#dealIconSelector .icon-option')) {
                const el = e.target.closest('.icon-option');
                const icon = el.dataset.icon;
                const isSelected = el.classList.contains('selected');
                
                if (isSelected) {
                    el.classList.remove('selected');
                    selectedDealIcons = selectedDealIcons.filter(i => i !== icon);
                } else if (selectedDealIcons.length < 5) {
                    el.classList.add('selected');
                    selectedDealIcons.push(icon);

                    showToast('⚠️ Maximum 5 icons allowed');

                document.getElementById('dealIcons').value = selectedDealIcons.join(',');

        });

            event.preventDefault();
            const name = document.getElementById('itemName').value;
            const price = parseFloat(document.getElementById('itemPrice').value);

            const icons = selectedIcons;
            const layersInput = document.getElementById('itemLayers').value;
            const layers = layersInput ? layersInput.split(',').map(l => l.trim()).filter(l => l) : [];

                showToast('⚠️ Please select at least one icon');
                return;

            fetch('/api/menu', {
                method: 'POST',

                    <button class="btn-submit" onclick="updateRestaurantName()" style="margin-top:10px;">💾 Save Name</button>
                </div>

                <div style="background:#2d2d44; border-radius:12px; padding:20px; margin-bottom:20px;">
                    <h3 style="color:#b2bec3; margin-bottom:15px;">🧾 Receipt Settings</h3>
                    <button class="btn-submit" onclick="openReceiptSettings()">📝 Edit Receipt Settings</button>
                </div>

                <div style="background:#2d2d44; border-radius:12px; padding:20px;">
                    <h3 style="color:#b2bec3; margin-bottom:15px;">📊 Data Management</h3>
                    <button class="btn-submit" onclick="refreshData()" style="background:#3498db;">🔄 Refresh All Data</button>
                    <button class="btn-submit" onclick="clearAllData()" style="background:#e74c3c; margin-top:10px;">🗑️ Clear All Data (Warning!)</button>
                </div>
            `;
            content.innerHTML = html;
        }

        function updateRestaurantName() {
            const name = document.getElementById('restaurantNameInput').value.trim();
            if (!name) {
                showToast('⚠️ Please enter a name');
                return;
            }
            fetch('/api/restaurant-name', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    restaurantName = name;
                    showToast('✅ Restaurant name updated!');
                } else {
                    showToast('❌ ' + (data.error || 'Failed to update'));
                }
            })
            .catch(() => showToast('❌ Network error'));
        }

        function openReceiptSettings() {
            fetch('/api/receipt-settings')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('receiptLogoIcon').value = data.logoIcon || '👨‍🍳';
                    document.getElementById('receiptLogoUrl').value = data.logoUrl || '';
                    document.getElementById('receiptTagline').value = data.tagline || 'PIZZA • BURGER • FAST FOOD';
                    document.getElementById('receiptThankYou').value = data.thankYouMessage || 'Thank You for Your Order!';
                    document.getElementById('receiptFooter').value = data.footerMessage || 'Have a Great Day!';
                    document.getElementById('receiptSettingsPopup').classList.add('show');
                })
                .catch(() => showToast('❌ Failed to load settings'));
        }

        function closeReceiptSettings() {
            document.getElementById('receiptSettingsPopup').classList.remove('show');
        }

        function saveReceiptSettings(event) {
            event.preventDefault();
            const settings = {
                logoIcon: document.getElementById('receiptLogoIcon').value || '👨‍🍳',
                logoUrl: document.getElementById('receiptLogoUrl').value || '',
                tagline: document.getElementById('receiptTagline').value || 'PIZZA • BURGER • FAST FOOD',
                thankYouMessage: document.getElementById('receiptThankYou').value || 'Thank You for Your Order!',
                footerMessage: document.getElementById('receiptFooter').value || 'Have a Great Day!'
            };

            fetch('/api/receipt-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showToast('✅ Receipt settings saved!');
                    closeReceiptSettings();
                } else {
                    showToast('❌ ' + (data.error || 'Failed to save'));
                }
            })
            .catch(() => showToast('❌ Network error'));
        }

        function refreshData() {
            showToast('🔄 Refreshing data...');
            loadData();
            setTimeout(() => showToast('✅ Data refreshed!'), 1000);
        }

        function clearAllData() {
            if (!confirm('⚠️ WARNING: This will delete ALL data! Are you sure?')) return;
            if (!confirm('⚠️ FINAL WARNING: This cannot be undone! Continue?')) return;
            showToast('❌ This feature is disabled for safety');
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // AUTO REFRESH
        // ============================================================
        setInterval(() => {
            if (currentSection === 'orders') loadOrders();
            if (currentSection === 'dashboard') loadOrders();
        }, 15000);
    </script>
</body>
</html>
