<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Restaurant - DineFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 { color: #2d3436; margin-bottom: 5px; }
        .subtitle { color: #636e72; margin-bottom: 25px; font-size: 0.9em; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 0.9em; margin-bottom: 5px; color: #2d3436; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        button:hover { background: #1e8449; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            display: block;
            background: #e8f8f0;
            border: 1px solid #27ae60;
            color: #1e8449;
        }
        .result.error {
            display: block;
            background: #fdf2f2;
            border: 1px solid #e74c3c;
            color: #c0392b;
        }
        .result .url-box {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            word-break: break-all;
            font-size: 0.9em;
            border: 1px solid #dfe6e9;
        }
        .result .url-box a {
            color: #667eea;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result .url-box a:hover { text-decoration: underline; }
        .result .url-box .url-icon {
            font-size: 1.2em;
        }
        .result .url-label {
            font-weight: 600;
            font-size: 0.9em;
            margin-top: 8px;
            display: block;
        }
        .result .url-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .result .url-card {
            background: #f8f9fa;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s;
        }
        .result .url-card:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .result .url-card .url-title {
            font-weight: 600;
            font-size: 0.85em;
            color: #2d3436;
            margin-bottom: 4px;
        }
        .result .url-card .url-link {
            font-size: 0.8em;
            word-break: break-all;
        }
        .result .url-card .url-link a {
            color: #667eea;
            text-decoration: none;
        }
        .result .url-card .url-link a:hover {
            text-decoration: underline;
        }
        .result .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.7em;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.3s;
        }
        .result .copy-btn:hover {
            background: #5a67d8;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #636e72;
            text-decoration: none;
            font-size: 0.85em;
        }
        .back-link:hover { color: #2d3436; }
        .loading { 
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #636e72;
        }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #dfe6e9;
            border-top-color: #27ae60;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .debug-info {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.8em;
            color: #636e72;
            display: none;
            border: 1px solid #dfe6e9;
        }
        .debug-info.show { display: block; }
        .debug-info code { 
            background: #f1f2f6; 
            padding: 2px 6px; 
            border-radius: 4px;
            font-size: 0.9em;
        }
        .debug-info.success { border-color: #27ae60; background: #e8f8f0; }
        .debug-info.error { border-color: #e74c3c; background: #fdf2f2; }
        .url-role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
            margin-left: 6px;
        }
        .badge-customer { background: #3498db; color: white; }
        .badge-admin { background: #e74c3c; color: white; }
        .badge-staff { background: #f39c12; color: white; }
        .badge-owner { background: #27ae60; color: white; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .result .url-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏪 Create Restaurant</h2>
        <p class="subtitle">Register a new restaurant in DineFlow</p>
        
        <form id="createForm">
            <div class="form-group">
                <label for="restName">Restaurant Name *</label>
                <input type="text" id="restName" placeholder="e.g., Tasty Bites" required />
            </div>
            <div class="form-group">
                <label for="ownerName">Owner Name *</label>
                <input type="text" id="ownerName" placeholder="e.g., Ali Ahmed" required />
            </div>
            <div class="form-group">
                <label for="ownerEmail">Owner Email *</label>
                <input type="email" id="ownerEmail" placeholder="owner@restaurant.com" required />
            </div>
            <button type="submit" id="submitBtn">🏪 Create Restaurant</button>
            <div class="loading" id="loading">
                <span class="spinner"></span> Creating restaurant...
            </div>
        </form>
        
        <div class="result" id="result"></div>
        
        <!-- Debug Info -->
        <div class="debug-info" id="debugInfo">
            <strong>🔍 Debug Info:</strong><br>
            <span id="debugMessage">Checking server connection...</span>
        </div>
        
        <a href="/" class="back-link">← Back to Customer Panel</a>
        <a href="/admin" class="back-link" style="margin-top:5px;">← Back to Admin Panel</a>
    </div>

    <script>
        // ============================================================
        // CHECK SERVER CONNECTION FIRST
        // ============================================================
        async function checkServerConnection() {
            const debugInfo = document.getElementById('debugInfo');
            const debugMessage = document.getElementById('debugMessage');
            
            debugInfo.classList.add('show');
            debugMessage.textContent = '⏳ Checking server connection...';
            
            try {
                const endpoints = ['/api/restaurant-config', '/api/test', '/api/deals'];
                let connected = false;
                
                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(endpoint, {
                            method: 'GET',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        
                        if (response.ok) {
                            connected = true;
                            debugMessage.textContent = `✅ Server is running! (${endpoint} responded)`;
                            debugInfo.className = 'debug-info show success';
                            break;
                        }
                    } catch (e) {
                        // Try next endpoint
                    }
                }
                
                if (!connected) {
                    debugMessage.textContent = '⚠️ Server is not responding. Make sure your server is running on Render.';
                    debugInfo.className = 'debug-info show error';
                }
            } catch (error) {
                debugMessage.textContent = `❌ Cannot connect to server. Error: ${error.message}`;
                debugInfo.className = 'debug-info show error';
                console.error('Connection error:', error);
            }
        }

        // Check connection on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkServerConnection();
        });

        // ============================================================
        // COPY TO CLIPBOARD FUNCTION
        // ============================================================
        function copyToClipboard(text, element) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    const originalText = element.textContent;
                    element.textContent = '✅ Copied!';
                    setTimeout(() => {
                        element.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    // Fallback
                    copyTextFallback(text, element);
                });
            } else {
                copyTextFallback(text, element);
            }
        }

        function copyTextFallback(text, element) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const originalText = element.textContent;
                element.textContent = '✅ Copied!';
                setTimeout(() => {
                    element.textContent = originalText;
                }, 2000);
            } catch (err) {
                alert('Failed to copy. Please copy manually.');
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        // FORM SUBMIT HANDLER - WITH STAFF URL
        // ============================================================
        document.getElementById('createForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('restName').value.trim();
            const ownerName = document.getElementById('ownerName').value.trim();
            const ownerEmail = document.getElementById('ownerEmail').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            const debugMessage = document.getElementById('debugMessage');
            const debugInfo = document.getElementById('debugInfo');
            
            if (!name || !ownerName || !ownerEmail) {
                showResult('error', '⚠️ Please fill in all fields');
                return;
            }
            
            submitBtn.disabled = true;
            loading.classList.add('show');
            resultDiv.className = 'result';
            resultDiv.style.display = 'none';
            debugMessage.textContent = '⏳ Sending request to server...';
            debugInfo.classList.add('show');
            debugInfo.className = 'debug-info show';
            
            const payload = { name, ownerName, ownerEmail };
            console.log('Sending payload:', payload);
            
            try {
                const response = await fetch('/api/restaurant/create', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                
                debugMessage.textContent = `📡 Server responded with status: ${response.status}`;
                
                let data;
                try {
                    data = await response.json();
                } catch (parseError) {
                    throw new Error('Invalid response from server');
                }
                
                console.log('Server response:', data);
                
                if (data.success) {
                    const baseUrl = window.location.origin;
                    const restaurantId = data.restaurantId;
                    
                    // Generate all URLs
                    const customerUrl = `${baseUrl}/?restaurant=${restaurantId}`;
                    const adminUrl = `${baseUrl}/admin?restaurant=${restaurantId}`;
                    const staffUrl = `${baseUrl}/staff?restaurant=${restaurantId}`;
                    const ownerUrl = `${baseUrl}/pixelpanel?restaurant=${restaurantId}`;
                    
                    showResult('success', `
                        ✅ <strong>Restaurant Created Successfully!</strong><br><br>
                        <strong>🏪 Restaurant:</strong> ${data.restaurant.name}<br>
                        <strong>🏪 Restaurant ID:</strong> ${restaurantId}<br>
                        <strong>👤 Owner:</strong> ${data.restaurant.ownerName}<br>
                        <strong>📧 Email:</strong> ${data.restaurant.ownerEmail}<br><br>
                        
                        <div class="url-grid">
                            <div class="url-card">
                                <div class="url-title">
                                    📱 Customer Panel
                                    <span class="url-role-badge badge-customer">Customer</span>
                                </div>
                                <div class="url-link">
                                    <a href="${customerUrl}" target="_blank">${customerUrl}</a>
                                </div>
                                <button class="copy-btn" onclick="copyToClipboard('${customerUrl}', this)">📋 Copy</button>
                            </div>
                            
                            <div class="url-card">
                                <div class="url-title">
                                    👑 Admin Panel
                                    <span class="url-role-badge badge-admin">Admin</span>
                                </div>
                                <div class="url-link">
                                    <a href="${adminUrl}" target="_blank">${adminUrl}</a>
                                </div>
                                <button class="copy-btn" onclick="copyToClipboard('${adminUrl}', this)">📋 Copy</button>
                            </div>
                            
                            <div class="url-card" style="border-color: #f39c12; background: #fef9e7;">
                                <div class="url-title">
                                    👨‍🍳 Staff Panel
                                    <span class="url-role-badge badge-staff">Staff</span>
                                </div>
                                <div class="url-link">
                                    <a href="${staffUrl}" target="_blank">${staffUrl}</a>
                                </div>
                                <button class="copy-btn" onclick="copyToClipboard('${staffUrl}', this)">📋 Copy</button>
                            </div>
                            
                            <div class="url-card" style="border-color: #27ae60; background: #e8f8f0;">
                                <div class="url-title">
                                    ⬛ PixelPanel (Owner)
                                    <span class="url-role-badge badge-owner">Owner</span>
                                </div>
                                <div class="url-link">
                                    <a href="${ownerUrl}" target="_blank">${ownerUrl}</a>
                                </div>
                                <button class="copy-btn" onclick="copyToClipboard('${ownerUrl}', this)">📋 Copy</button>
                            </div>
                        </div>
                        
                        <div style="margin-top: 12px; padding: 10px; background: #f8f9fa; border-radius: 8px; font-size: 0.8em; color: #636e72;">
                            <strong>💡 Quick Summary:</strong><br>
                            🧑‍💼 <strong>Customer:</strong> Browse menu & place orders<br>
                            👨‍💼 <strong>Admin:</strong> Manage restaurant, orders & settings<br>
                            👨‍🍳 <strong>Staff:</strong> Take orders from customers<br>
                            👤 <strong>Owner:</strong> Full access to everything
                        </div>
                    `);
                    
                    debugMessage.textContent = '✅ Restaurant created successfully!';
                    debugInfo.className = 'debug-info show success';
                    
                    // Reset form
                    document.getElementById('restName').value = '';
                    document.getElementById('ownerName').value = '';
                    document.getElementById('ownerEmail').value = '';
                } else {
                    showResult('error', '❌ Error: ' + (data.error || 'Something went wrong'));
                    debugMessage.textContent = `❌ Server error: ${data.error || 'Unknown error'}`;
                    debugInfo.className = 'debug-info show error';
                }
            } catch (error) {
                console.error('Error:', error);
                showResult('error', `
                    ❌ <strong>Network Error</strong><br><br>
                    ${error.message || 'Could not connect to server.'}<br><br>
                    <strong>💡 Possible Solutions:</strong><br>
                    1. Check if your server is running on Render<br>
                    2. Check if the API endpoint is correct<br>
                    3. Try refreshing the page<br>
                    4. Check your internet connection
                `);
                debugMessage.textContent = `❌ Network error: ${error.message}`;
                debugInfo.className = 'debug-info show error';
            }
            
            submitBtn.disabled = false;
            loading.classList.remove('show');
        });
        
        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
        }
        
        // ============================================================
        // RETRY CONNECTION
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' && e.ctrlKey) {
                checkServerConnection();
            }
        });
    </script>
</body>
</html>
